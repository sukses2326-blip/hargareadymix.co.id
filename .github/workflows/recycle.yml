# After pushing, this workflow dispatches deploy.yml, which builds Hugo and commits public/
# (Cloudflare Pages serves only the public/ folder).
name: Recycle Old Posts

on:
  schedule:
    # Weekly (Sunday 00:00 UTC = 07:00 WIB). Only articles whose last touch (lastmod, or date)
    # is >= 12 months old are recycled, so checking more often has no real benefit.
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write
  # Needed to dispatch deploy.yml at the end (GITHUB_TOKEN pushes don't fire `push` workflows).
  actions: write

jobs:
  recycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Recycle old posts (sets lastmod)
        run: npm run recycle

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and Push Changes
        id: commit_push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add content/

          if git diff --staged --quiet; then
            echo "ℹ️  No articles to recycle this week — done."
            exit 0
          fi

          git commit -m "Recycle posts (lastmod)"

          for i in 1 2 3 4 5; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "✅ Push successful (attempt $i)."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ The push still fails after 5 attempts — there is likely a genuine conflict; please check manually." >&2
              exit 1
            fi
            wait_s=$(( (RANDOM % 10) + 5 ))
            echo "⏳ Push rejected (possible race with another workflow), rebasing & retrying in ${wait_s}s... (attempt $i/5)"
            sleep "$wait_s"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
          done

      # Pushes made with GITHUB_TOKEN don't fire deploy.yml's `push` trigger, so dispatch it
      # explicitly — otherwise the new commit would sit on the branch with public/ not rebuilt.
      - name: Trigger Deploy (rebuild public/ now)
        if: steps.commit_push.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Changes pushed — triggering deploy.yml so public/ is rebuilt now..."
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
