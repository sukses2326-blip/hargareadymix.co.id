# OPTIONAL — only for GitHub Pages hosting (public/ committed to the repo, like betoncorplus.com).
# Cloudflare Pages users do NOT need this. To enable: move to .github/workflows/deploy.yml and
# re-add a "gh workflow run deploy.yml" step to the generate/revise/fix-orphans workflows
# (pushes made with GITHUB_TOKEN do not fire `push` triggers).
name: Deploy Site
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths-ignore: [ 'public/**' ]
concurrency:
  group: repo-write
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.124.0'
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Commit and push public/
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/
          git diff --staged --quiet && { echo "public/ unchanged"; exit 0; }
          git commit -m "Build site"
          git push origin HEAD:"${GITHUB_REF_NAME}"
