# Builds the site with Hugo and commits the result to public/ (Cloudflare Pages serves only the
# public/ folder). Runs on every push (except pushes that only touch public/) and is also
# dispatched explicitly by generate-articles / revise-articles / fix-orphans / recycle, because
# pushes made with GITHUB_TOKEN do not fire `push` triggers.
name: Deploy Site
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths-ignore: [ 'public/**' ]
concurrency:
  group: repo-write
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: needed to find the previous "Build site" commit for IndexNow
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.124.0'
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'
          cache: 'npm'
      - run: npm ci
      # IndexNow: remember which commit the previous deploy was built from and which commit is built now,
      # so only pages changed in between are submitted — AFTER the site is live (see last step).
      - name: Remember previous build and ensure IndexNow key
        run: |
          echo "PREV_BUILD=$(git log -n1 --format=%H --grep='^Build site$' || true)" >> "$GITHUB_ENV"
          echo "CONTENT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node tools/indexnow-submit.js --ensure-key
      # prebuild (spintax -> data/testimonials.yaml) + hugo --minify + robots.txt/sitemap.xml.gz
      - run: npm run build
      - name: Commit and push public/
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A public/
          # The IndexNow key + its verification file must stay the same forever and be served at the site root.
          if [ -f .indexnow-key.json ]; then
            KEY=$(node -p "require('./.indexnow-key.json').key")
            git add .indexnow-key.json "static/$KEY.txt"
          fi
          git diff --staged --quiet && { echo "public/ unchanged"; exit 0; }
          git commit -m "Build site"
          for i in 1 2 3 4 5; do
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            sleep $(( (RANDOM % 10) + 5 ))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
          done
          echo "❌ push failed after 5 attempts" >&2; exit 1
      # Runs only after public/ was pushed. Waits for Cloudflare Pages to publish, then submits the
      # changed URLs to IndexNow (Bing/Yandex/Seznam/Naver). A failure here never fails the deploy.
      - name: Ping IndexNow (after the site is live)
        if: success()
        run: node tools/indexnow-submit.js --prev="$PREV_BUILD" --head="$CONTENT_HEAD" --wait
